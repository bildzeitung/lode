[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "lode"
dynamic = ["version"]
description = "AI-first, TUI-first personal knowledge base for things you learn at work."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"                # SPDX expression (PEP 639) — needs setuptools>=77
license-files = ["LICENSE"]

# Runtime dependencies are seeded from the decided stack (docs/stack.md).
# This file stays the INTENT layer -- ranges/floors, with a real lower bound
# only where a version demonstrably matters (trafilatura below is the first
# such case). requirements.lock is the ONLY place exact versions live --
# regenerated via `uv pip compile` (scripts/python-init.sh), never hand-edited
# here. See docs/stack.md#dependency-locking-lode-g2741 for the split.
dependencies = [
    "textual[syntax]", # TUI, plus the tree-sitter grammar bundle (~15
                       # languages, no markdown-only extra) -- HARD dep for
                       # live markdown syntax colouring in the note body
                       # TextAreas (lode-ev5j.2). Deps stay unpinned; the
                       # feature's SOURCE uses no private Textual API. Its
                       # tests do (TextArea._highlights) -- deliberately, per
                       # the ticket, to avoid a pytest-textual-snapshot dev
                       # dep; see tests/test_tui_markdown_syntax.py.
    "typer",       # CLI (repo convention — never argparse)
    "rich",        # CLI colour/width rendering (lode-l38d.1 — see docs/stack.md)
    "anthropic",   # Claude API (enrichment Haiku, Q&A Sonnet/Opus)
    "openai",      # OpenAI-via-Azure LLMProvider (lode-568v.3) -- Responses API
    "pydantic",    # structured outputs for the derived layer
    "fastembed",   # embeddings + reranker + NLI via bundled ONNX runtime
    "pyarrow",     # direct import in vectorstore.py (lode-zcoz) — lancedb's
                   # schema API, so `_schema()` builds a pa.schema() itself.
                   # Satisfied transitively via lancedb today; declared anyway
                   # because we import it directly, so a lancedb release that
                   # drops it cannot silently break our import.
    "huggingface_hub", # cache-only probe for `lode status` (lode-l38d.6) --
                       # already a transitive fastembed dep; listed direct
                       # (unpinned, like the rest) since cli.py now imports it
                       # without importing fastembed
    "lancedb",     # on-disk vector store (ANN + metadata filtering)
    "networkx",    # in-memory knowledge-graph traversal
    "xxhash",      # 128-bit content-address hash (docs/storage.md)
    "httpx",       # web draw-down HTTP client (lode-w0h.1 — see docs/stack.md)
    "trafilatura>=2.1,<2.2", # web draw-down readability extraction
                             # (lode-w0h.1 — see docs/stack.md). Bounded to the
                             # 2.1.x series (lode-g274.1) so the lock resolves
                             # 2.1.0, the version lode-g274.3's characterization
                             # fixtures assert extraction behavior against.
                             # Moving off 2.1.0 is a deliberate act: bump this
                             # ceiling and re-baseline lode-g274.3 first.
]

[project.optional-dependencies]
dev = [
    "pytest",        # tests (run via nox)
    "pytest-xdist",  # parallel test execution (`-n auto`, lode-b4w.6)
    "pytest-cov",    # coverage measurement (`nox -s coverage`, lode-qxdn.3, CI-only)
    "pytest-timeout", # per-test timeout regression net (lode-kmes) -- turns a
                      # wedged test into a named failure instead of an
                      # indefinite stall on the landing gate; see the
                      # `[tool.pytest.ini_options]` `timeout` setting below.
    "nox",           # task runner (`nox -t fix` before merging)
    "ruff==0.16.0",   # lint / format -- pinned to prevent unwanted churn
                      # Single-tool carve-out from the otherwise-unlocked `dev`
		      # extra (lode-g274.1) -- not a reversal of that policy
		      # for any other dev tool.
    "shellcheck-py", # bundles the shellcheck binary — the `nox -s shellcheck` gate
    "build",         # `python -m build` — canonical wheel/sdist packaging front-end
    "pyyaml",        # tests/test_workflow_concurrency.py's direct `import yaml`
                     # (lode-4lqx) -- previously reached the venv only
                     # transitively via huggingface_hub (lode-z31w).
    "numpy",         # tests/test_worker.py's direct `import numpy as np` --
                     # previously reached the venv only transitively via
                     # fastembed/onnxruntime (lode-sjbo, same defect class
                     # as lode-z31w).
    "packaging",     # tests/test_deps_declared.py's and tests/test_cli.py's
                     # direct `from packaging...` imports -- previously
                     # reached the venv only transitively (lode-sjbo).
    "tree-sitter-markdown", # tests/test_tui_markdown_syntax.py's direct
                            # `import tree_sitter_markdown` -- previously
                            # reached the venv only transitively via
                            # textual[syntax] (lode-sjbo). Hyphenated: a
                            # requirement names the distribution, not the
                            # import.
]
docs = [
    "mkdocs-material>=9.5,<10", # docs-site generator (lode-fhql.8; rationale
                                # in docs/stack.md). Its own extra rather than
                                # `dev` because it is CI-only -- lode-fhql.9's
                                # Pages workflow, not a local `dev` install.
]

[project.scripts]
lode = "lode.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
# --strict-markers turns a typo'd @pytest.mark.slow into a collection error
# instead of a silently-ignored no-op, so the fast/slow split (lode-pql) stays
# honest. See noxfile.py's `unit` session for the fast inner-loop command that
# filters on this marker; `nox -s tests` (bare pytest, no -m filter) ignores
# the marker entirely and always runs everything — the landing gate.
addopts = "--strict-markers"
# Global per-test timeout (lode-kmes) -- the regression net for the
# intermittent whole-suite hang this ticket root-caused (a leaked root-logger
# DEBUG level enabling a never-returning latency-probe worker, see
# tests/conftest.py's `_restore_root_logger_state`). 120s comfortably clears
# every real test's cost -- the slowest offline tests pay a one-time
# FastEmbedCrossEncoder model-load of a few seconds each -- while still
# turning a future wedged test into a named failure long before it could
# stall a `/land` pass for 20+ minutes. `tests/test_eval_live.py`'s live eval
# leg (~273s, only runs opted-in via `nox -s eval`) overrides this with its
# own `@pytest.mark.timeout(...)`.
timeout = 120
markers = [
    "slow: real model-load cost (the FastEmbedCrossEncoder reranker or the live eval Q&A leg), not just more assertions — excluded from the fast inner-loop (`nox -s unit` / `pytest -m 'not slow'`), always included in the full suite (`nox -s tests`, the landing gate).",
    "network: this test deliberately reaches real, un-mocked Anthropic SDK / network machinery (lode-85q) — the explicit, greppable escape hatch from tests/conftest.py's autouse network+LLM-client guard. Every other test fails loudly, not silently, if it ever falls through to a real network call or a real anthropic.Anthropic() construction.",
    "trips_network_guard: this test TRIPS tests/conftest.py's network/LLM-client guard on purpose and catches the raise itself, so it consumes the recorded violation instead of failing on it in teardown (lode-sx17). NOT an escape hatch — the guard still fires and still blocks the call; use @pytest.mark.network for a test that needs the call to actually go out. Checked for staleness in both directions: a marked test that trips nothing also fails.",
    "serial: this test asserts a wall-clock budget, so it must not share the machine with sibling pytest-xdist workers (lode-887o: 0.320s measured against a 0.25s budget under `-n 8` on a loaded machine, green on the very next unloaded run). `nox -s tests` — the landing gate — runs the suite as `-m 'not serial'` under `-n 8` and then re-invokes pytest as `-m serial -n 0`, so every test still runs exactly once. The fast inner loop (`nox -s unit`) and `nox -s coverage` do NOT split this way; a serial test's budget must therefore still be wide enough to survive parallel load there.",
    "real_embedder: this test needs the genuine lode.embedding.FastEmbedEmbedder, not tests/conftest.py's autouse offline stub (lode-7ypf) — for a test asserting on what the installed fastembed/huggingface_hub itself does. Does NOT relax the socket guard: use it for a test that is hermetic by other means (e.g. HF_HUB_OFFLINE=1 against a cold $LODE_HOME); reach for network/slow if the call must actually go out.",
]

[tool.setuptools_scm]
# The git tag is the single source of truth for the version (docs/release.md);
# this file is build-generated and gitignored, never committed.
version_file = "src/lode/_version.py"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the data-shape DDL (docs/storage.md §8) with the package so
# lode.storage.init_db can load it via importlib.resources at runtime.
lode = ["*.sql"]
# Ship the TUI's external stylesheet (lode-1i8.4) — package-data keys are
# per-package and non-recursive, so lode.tui needs its own entry.
"lode.tui" = ["*.tcss"]

[tool.ruff.lint]
ignore = []
