[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "lode"
dynamic = ["version"]
description = "AI-first, TUI-first personal knowledge base for things you learn at work."
readme = "README.md"
requires-python = ">=3.14"

# Runtime dependencies are seeded from the decided stack (docs/stack.md), the
# same source as requirements.txt. Intentionally unpinned until the build starts
# (docs/design.md §7); pin both files together when that happens.
dependencies = [
    "textual",   # TUI
    "typer",     # CLI (repo convention — never argparse)
    "anthropic", # Claude API (enrichment Haiku, Q&A Sonnet/Opus)
    "pydantic",  # structured outputs for the derived layer
    "fastembed", # embeddings + reranker + NLI via bundled ONNX runtime
    "lancedb",   # on-disk vector store (ANN + metadata filtering)
    "networkx",  # in-memory knowledge-graph traversal
    "xxhash",    # 128-bit content-address hash (docs/storage.md)
]

[project.optional-dependencies]
dev = [
    "pytest", # tests (run via nox)
    "nox",    # task runner (`nox -t fix` before merging)
    "ruff",   # lint / format
    "build",  # `python -m build` — canonical wheel/sdist packaging front-end
]

[project.scripts]
lode = "lode.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
# --strict-markers turns a typo'd @pytest.mark.slow into a collection error
# instead of a silently-ignored no-op, so the fast/slow split (lode-pql) stays
# honest. See noxfile.py's `unit` session for the fast inner-loop command that
# filters on this marker; `nox -s tests` (bare pytest, no -m filter) ignores
# the marker entirely and always runs everything — the landing gate.
addopts = "--strict-markers"
markers = [
    "slow: real model-load cost (the FastEmbedCrossEncoder reranker or the live eval Q&A leg), not just more assertions — excluded from the fast inner-loop (`nox -s unit` / `pytest -m 'not slow'`), always included in the full suite (`nox -s tests`, the landing gate).",
]

[tool.setuptools_scm]
# The git tag is the single source of truth for the version (docs/release.md);
# this file is build-generated and gitignored, never committed.
version_file = "src/lode/_version.py"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the data-shape DDL (docs/storage.md §8) with the package so
# lode.storage.init_db can load it via importlib.resources at runtime.
lode = ["*.sql"]
# Ship the TUI's external stylesheet (lode-1i8.4) — package-data keys are
# per-package and non-recursive, so lode.tui needs its own entry.
"lode.tui" = ["*.tcss"]
