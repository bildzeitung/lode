name: tests

# Push/PR-triggered test-suite gate -- the FULL `nox -s tests` suite (no
# marker filter, includes @pytest.mark.slow), on Python 3.14. This is the
# check the "tests passing" badge is backed by (lode-qxdn.2/.5) -- running the
# full suite rather than the fast `nox -s unit` subset was a deliberate call
# (see lode-qxdn.2's design notes): the slow tier is download-gated, not
# compute-slow, and excluding it would drop the only coverage of the
# un-mocked FastEmbedCrossEncoder reranker. Workflow filename is FROZEN:
# lode-qxdn.5's badge URL will hard-code workflows/tests.yml/badge.svg.
#
# Also hosts the `lock-currency` job (lode-g274.6): the `tests` job below
# installs from the committed, hash-verified `requirements.lock` rather than
# resolving fresh, so this workflow tests the same bytes a developer runs;
# `lock-currency` separately verifies that lock is still what `pyproject.toml`
# would produce today. See each job's own comments for the mechanism.
#
# push trigger convention (lode-bmvy, mirrored from build.yml) -- narrowed to
# trunk + land/** so this workflow (heavier than build.yml: a full `-e
# .[dev]` install plus reranker/embedder weights) doesn't also fire on a v*
# tag push or other non-push refs. No tags-ignore needed -- defining only
# `branches` already excludes tag pushes; see
# docs/release.md#ci-workflow-trigger-scope-push-and-pull_request.
on:
  push:
    branches: [trunk, "land/**"]
  pull_request:

# Producers push land/<id> ~2-3x per ticket (builder, code-reviewer, sometimes a
# rebase), and each push fires a fresh, heavy run. Nothing in the landing loop
# reads these check results -- /land re-gates locally and never consults
# GitHub Actions (docs/release.md) -- so a superseded run on an older commit
# of the same ref has zero consumers; cancelling it cannot lose information
# (lode-2ouz).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Point LODE_HOME at a workspace-local path (rather than leaving it at the
  # default ~/.lode) so the model-weights cache below lives at a path that
  # does not depend on the runner's HOME (config.py's lode_home() /
  # model_cache_dir()).
  LODE_HOME: ${{ github.workspace }}/.lode-ci-home
  # noxfile.py's _xdist_workers() defaults to 8 -- sized for the 8-core dev
  # numbers in the noxfile's own docstring. GitHub's free ubuntu-latest
  # runners are 2-core/7GB; 8 workers each loading a ~1.1GB ONNX reranker
  # would risk OOM. Pin to 2 here.
  #
  # Known cost of that pin, per noxfile.py's own docstring: a narrow -n muzzles
  # the CPU-starvation flakes the 8-wide default exists to keep visible
  # (lode-t1y/lode-9vns/lode-64jn) -- those are defects that go UNOBSERVED at
  # -n 2, not defects that went away. Do not read a green badge here as
  # evidence those races are fixed; the developer/landing gate at -n 8 is what
  # exercises them.
  LODE_TEST_WORKERS: "2"

jobs:
  # Cheap, independent check: verify requirements.lock is still what
  # scripts/compile-lock.sh (the single shared lock-gen command, lode-sys4)
  # would produce for the CURRENT pyproject.toml. No model download, no
  # dev-extra install -- runs in parallel with (not gated by, or gating) the
  # `tests` job below, so a stale lock fails in seconds rather than after
  # paying for the slow leg's model download (lode-g274.6).
  #
  # Recompiling `-o requirements.lock` IN PLACE against the file this job
  # just checked out is the whole mechanism: uv feeds an existing output
  # file's own pins back to the resolver as its PREFERENCE set by default
  # (only `--upgrade`/`-U` would ignore them -- `uv pip compile --help`), so
  # the resolution only moves when a pyproject.toml constraint forces it. An
  # upstream release alone (pyproject.toml and the committed lock both
  # unchanged) reproduces the committed lock byte-for-byte and this job stays
  # green; a `pyproject.toml` dependency change without a matching
  # `requirements.lock` regeneration changes the resolution and this job
  # fails the diff. Verified empirically (lode-g274.6 build notes): recompiling
  # in place against an untouched pyproject.toml is byte-identical to the
  # committed lock; a genuinely fresh compile (no prior content at the -o
  # path) resolves a DIFFERENT graph -- concrete proof the preference-seeding
  # is load-bearing, not cosmetic.
  #
  # scripts/compile-lock.sh derives --python-version from .python-version
  # (lode-sys4 / lode-gyag root cause): without it, `uv pip compile` resolves
  # against whichever interpreter it finds, which can differ from this job's
  # own 3.14 and silently pick up/drop python-version-marker-gated transitives
  # (lancedb's `overrides`, anyio's marker-gated `typing_extensions`),
  # producing a lock that flaps against this diff for reasons unrelated to
  # any real pyproject.toml change.
  lock-currency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # fetch-depth: 0 not needed here -- this job never runs `pip install
        # -e .`, so setuptools-scm's git-describe requirement (which is why
        # the `tests` job below needs full history) doesn't apply.

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          # Reads the SAME file scripts/compile-lock.sh derives its
          # --python-version target from (lode-sys4) -- this job's own
          # interpreter and the lock-gen target are the same single source of
          # truth, so they can never drift from each other on this leg.

      - name: Install uv
        run: pip install -U uv

      - name: Recompile requirements.lock, using the committed lock as the resolver's preference set
        run: scripts/compile-lock.sh -o requirements.lock

      - name: Fail if the recompiled lock differs from the committed one
        run: git diff --exit-code requirements.lock

  tests:
    runs-on: ubuntu-latest
    # Well below GitHub's 360-minute default -- a hung model download (the
    # exact failure the weights cache exists to mitigate) would otherwise burn
    # six hours producing nothing. ~3x an observed green run (lode-2ouz).
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags — setuptools-scm needs git describe to resolve the version

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          # No `cache: pip` here -- this leg installs via `uv` (below, through
          # scripts/python-init.sh), which uses its own cache directory
          # (~/.cache/uv), never pip's. A `cache: pip` option would populate
          # nothing and silently do no work.

      - name: Install dependencies (from requirements.lock)
        # Installs the same bytes a developer runs: the exact, hash-verified
        # runtime set from requirements.lock, via the canonical 3-step
        # locked install (scripts/python-init.sh, lode-g274.1) rather than a
        # hand-copied duplicate of its steps in this YAML. Currency of the
        # lock itself is the separate `lock-currency` job above, not this
        # step -- this step trusts whatever lock was checked out.
        run: |
          ./scripts/python-init.sh
          echo "$(pwd)/venv/bin" >> "$GITHUB_PATH"

      - name: Resolve model cache key
        # SINGLE implementation shared with coverage.yml -- see
        # scripts/model-cache-key.py's own docstring for the full rationale
        # (deriving the key from `Settings` rather than a lockfile/constant),
        # matching the `build` nox session precedent for this class of
        # duplication (noxfile.py) (lode-sx23).
        # NB this step must stay AFTER the install (the script imports lode)
        # and BEFORE the cache restore below.
        id: model_cache
        run: python scripts/model-cache-key.py >> "$GITHUB_OUTPUT"

      - name: Restore model weights cache
        # $LODE_HOME/models (config.py's model_cache_dir()) -- ~1.6GB of ONNX
        # weights (BAAI/bge-reranker-base + nomic-ai/nomic-embed-text-v1.5).
        # On a cache hit the slow leg runs fully offline; on a miss it
        # downloads once. This is the mitigation for a model-host outage
        # turning a good commit red on a public badge, not an optimization
        # (lode-qxdn.2 design notes) -- do not drop it.
        #
        # Split into restore + save (below) rather than the single
        # actions/cache@v4 step: GitHub only runs a step's post action (which
        # is where actions/cache@v4 saves) if the job reaches that point in
        # its normal reverse-order unwind -- if `nox -s tests` fails, the job
        # is marked failed and post steps of already-run actions are skipped,
        # so a single actions/cache@v4 step would silently skip saving on
        # every red run. That is exactly backwards: the run most likely to be
        # red (a fresh model pin, a flake) is also the one most likely to be
        # cold, so every retry would re-download 1.6GB until one run goes
        # fully green -- undercutting the cache's whole purpose as an outage
        # mitigation. VERIFIED (lode-2ouz; GitHub Actions docs + community
        # discussion #165508): "GitHub runs post steps only if the job
        # completes [successfully]. If a job fails, post steps of all actions
        # in that job are skipped." An explicit save step with `if: always()`
        # is the documented workaround.
        id: restore_model_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.LODE_HOME }}/models
          key: ${{ steps.model_cache.outputs.key }}

      - name: Run tests (nox -s tests)
        # noxfile.py sets default_venv_backend = "none" and the `tests`
        # session does no session.install() of its own -- it just runs
        # `pytest -n <workers>` against whatever's already on PATH, so the
        # dependency install above must happen first or this dies importing
        # `lode`. No ANTHROPIC_API_KEY is set: the live eval
        # (tests/test_eval_live.py) self-excludes unless LODE_RUN_LIVE_EVAL=1,
        # which only `nox -s eval` sets, so this leg stays offline and
        # keyless by design.
        run: nox -s tests

      - name: Save model weights cache
        # Runs on a FAILED `nox -s tests` (the point of the split -- see the
        # restore step above) but NOT on a cancelled run. cancelled() matters
        # here specifically because of this workflow's own `concurrency:
        # cancel-in-progress` (a second push to the same land/<id> cancels the
        # in-flight run): a cancellation can fire mid-download, and actions/cache
        # keys are IMMUTABLE -- once a partial $LODE_HOME/models is saved under
        # this content-key it can never be overwritten by a later complete run,
        # so the cache is pinned incomplete until it evicts (~7d) and silently
        # stops being the offline-outage mitigation it exists to be. A genuine
        # test failure is safe to save from: the reranker/embedder load at
        # session setup, well before any test body runs, so on a red run the
        # weights are already complete. `!cancelled()` keeps the save-on-failure
        # behaviour while refusing to persist a torn-off partial. Skip too on an
        # exact restore hit (cache-hit == 'true'): the key already holds this
        # content, so re-saving is wasted work and (per action version) a
        # same-key save error.
        if: ${{ !cancelled() && steps.restore_model_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.LODE_HOME }}/models
          key: ${{ steps.restore_model_cache.outputs.cache-primary-key }}
