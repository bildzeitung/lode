name: build

# Push/PR-triggered packaging check — catches a packaging regression
# (pyproject/setuptools-scm/package-data) before a release cuts, rather than
# only on a vX.Y.Z tag like release.yml. Workflow FILENAME is FROZEN: README's
# build badge (lode-qxdn.4) hard-codes build.yml twice — in the shields.io
# endpoint .../actions/workflow/status/bildzeitung/lode/build.yml?branch=trunk
# and in the link target .../actions/workflows/build.yml. Renaming this file
# breaks both. Note it is the FILENAME, not the `name:` key above, that is
# load-bearing; the ?branch=trunk pin is deliberate (it makes the badge report
# trunk unconditionally, rather than relying on a default-branch fallback), so
# keep it on any sibling badge added by lode-qxdn.2/.3.
#
# push trigger convention (lode-bmvy) — mirror this in any sibling push-
# triggered CI workflow (lode-qxdn.2, lode-qxdn.3): narrowed to trunk +
# land/** so it doesn't also fire on a v* tag push (double-building against
# release.yml) or on Dolt sync traffic (refs/dolt/data never matches a push
# event anyway). No tags-ignore needed — defining only `branches` already
# excludes tag pushes; see
# docs/release.md#ci-workflow-trigger-scope-push-and-pull_request.
on:
  push:
    branches: [trunk, "land/**"]
  pull_request:

# Producers push land/<id> ~2-3x per ticket (builder, code-reviewer, sometimes a
# rebase), and each push fires a fresh run. Nothing in the landing loop reads
# these check results -- /land re-gates locally and never consults GitHub
# Actions (docs/release.md) -- so a superseded run on an older commit of the
# same ref has zero consumers; cancelling it cannot lose information (lode-2ouz).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Well below GitHub's 360-minute default -- caps the tail if a step hangs
    # (e.g. a stalled pip/PyPI fetch) rather than burning hours for nothing
    # (lode-2ouz).
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags — setuptools-scm needs git describe to resolve the version

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          # NOT the default requirements.txt key -- that file is a single
          # permanent `-e .[dev]` line that never changes, so that key would
          # never invalidate. pyproject.toml is the real dependency source of
          # truth (lode-2ouz).
          cache-dependency-path: pyproject.toml

      - name: Install build tooling
        # `build` is NOT redundant alongside nox: noxfile.py sets
        # default_venv_backend = "none", so the session shells out to
        # `python -m build` in this ambient interpreter and never installs it.
        run: pip install build nox

      # Step name mentions the assertion on purpose: it runs inside the same
      # session, so a red run here is just as likely to be missing package-data
      # as a failed build, and the CI UI shows only this name.
      - name: Build wheel + sdist, assert package-data
        # Calls noxfile.py's `build` session rather than re-copying its
        # assertion here, so CI and the local gate cannot drift — the earlier
        # hand-copy already did. See that session's docstring for why a clean
        # `python -m build` exit doesn't prove package-data shipped.
        # release.yml calls the same session for the published wheel (lode-zuqp).
        run: nox -s build
