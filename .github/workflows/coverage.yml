name: coverage

# Push/PR-triggered coverage measurement -- a SEPARATE CI-only invocation of
# the FULL `nox -s coverage` suite (same suite `nox -s tests`/tests.yml
# certifies, no marker filter), on Python 3.14. Report-only (lode-qxdn.3):
# there is no coverage-percentage threshold here, and neither a low
# percentage nor a Codecov upload failure turns this workflow red. The
# shared `tests` nox session stays bare `pytest -n` with no --cov, so
# coverage instrumentation never rides `/land`'s re-gate or a developer's
# local `nox -s tests` -- see noxfile.py's `coverage` session docstring.
# Workflow filename/job identity for lode-qxdn.6's badge: coverage.yml / job
# `coverage`.
#
# push trigger convention (lode-bmvy, mirrored from build.yml/tests.yml) --
# narrowed to trunk + land/** so this workflow (as heavy as tests.yml: a full
# dependency install plus reranker/embedder weights, running the full suite
# a second time) doesn't also fire on a v* tag push or other non-push refs.
# No tags-ignore needed -- defining only `branches` already excludes tag
# pushes; see docs/release.md#ci-workflow-trigger-scope-push-and-pull_request.
on:
  push:
    branches: [trunk, "land/**"]
  pull_request:

# Cancels a superseded run on the same ref, as in tests.yml/build.yml.
# Convention + rationale:
# docs/release.md#ci-workflow-concurrency-and-job-timeouts-lode-2ouz-lode-w35h.
# The one consumer this leg adds over its siblings is the README's Codecov
# badge, which reads Codecov's dashboard for `trunk` rather than Actions
# status: a cancel does skip that run's upload, but the push that cancelled it
# uploads in turn, so the badge can lag one push and no more.
#
# No need for the split-step precaution tests.yml takes (see its `!cancelled()`
# comment): actions/cache@v4 declares its save (post) step `post-if: success()`
# -- verified in upstream's action.yml -- so a cancelled run never reaches the
# save and cannot pin a partial $LODE_HOME/models under an immutable key.
# success() is false on a RED run too, so this single step likewise never saves
# on failure -- the hazard that split exists to fix. Inert here ONLY because the
# key is shared and byte-identical with tests.yml, whose split saves it anyway
# under `!cancelled()`. Don't "fix" the asymmetry by splitting this step; do
# revisit if those two keys ever diverge (lode-s1ia).
# Fallback is github.ref_name, NOT github.ref: on push, github.ref is
# refs/heads/<branch>, but on pull_request it's refs/pull/<N>/merge -- two
# different strings for the same branch, so a push run and its PR run would
# otherwise never share a group and neither cancels the other. head_ref is
# unset on push, so `head_ref || ref_name` collapses both events onto the
# same bare branch name (`head_ref || ref` does NOT work -- ref still keeps
# the refs/pull/<N>/merge form on pull_request). See lode-7hbu.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  # Point LODE_HOME at a workspace-local path (rather than leaving it at the
  # default ~/.lode) so the model-weights cache below lives at a path that
  # does not depend on the runner's HOME (config.py's lode_home() /
  # model_cache_dir()).
  LODE_HOME: ${{ github.workspace }}/.lode-ci-home
  # Same pin as tests.yml, for the same reason: noxfile.py's
  # _xdist_workers() defaults to 8 (sized for an 8-core dev machine).
  # GitHub's free ubuntu-latest runners are 2-core/7GB; 8 workers each
  # loading a ~1.1GB ONNX reranker would risk OOM. See tests.yml's comment
  # for the known cost of this pin (it muzzles the CPU-starvation flakes the
  # 8-wide default exists to keep visible -- lode-t1y/lode-9vns/lode-64jn --
  # those are defects that go unobserved here, not defects that went away).
  LODE_TEST_WORKERS: "2"

jobs:
  coverage:
    runs-on: ubuntu-latest
    # Same cap as tests.yml -- coverage is within noise of tests, not slower. A
    # hang catcher, not a perf budget: warm runs land at ~2-4min, and cold is no
    # different (tests.yml run 29783519618 populated the shared 958MB weights
    # cache in 135s end to end, lode-s1ia). Ladder + rationale:
    # docs/release.md#ci-workflow-concurrency-and-job-timeouts-lode-2ouz-lode-w35h.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags — setuptools-scm needs git describe to resolve the version

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install dependencies (from requirements.lock)
        # Must install into ./venv, NOT the runner's ambient interpreter:
        # noxfile.py's `coverage` session resolves `pytest` to an explicit
        # path under ./venv/bin (_venv_tool, lode-0yfn) and fails closed if
        # it isn't there, so a bare `pip install -e '.[dev]'` would leave
        # `nox -s coverage` below aborting on every run.
        #
        # No `--unlocked`: this leg installs the committed, hash-verified
        # requirements.lock, exactly as tests.yml does, so the coverage number
        # describes the same dependency set the tests badge backs and is
        # reproducible from committed bytes. That parity is a decision
        # (lode-7byn), not an accident -- for why this leg resolved fresh
        # until then, and what the lock does and does not cover here, see
        # docs/stack.md#dependency-locking-lode-g2741. The GITHUB_PATH line
        # then puts the venv ahead of the ambient interpreter for the
        # `python`/`nox` steps below, exactly as tests.yml does.
        run: |
          ./scripts/python-init.sh
          echo "$(pwd)/venv/bin" >> "$GITHUB_PATH"

      - name: Resolve model cache key
        # SINGLE implementation shared with tests.yml -- see
        # scripts/model-cache-key.py's own docstring for the full rationale
        # (deriving the key from `Settings` rather than a lockfile/constant),
        # matching the `build` nox session precedent for this class of
        # duplication (noxfile.py) (lode-sx23).
        # NB this step must stay AFTER the install (the script imports lode)
        # and BEFORE the cache restore below.
        id: model_cache
        run: python scripts/model-cache-key.py >> "$GITHUB_OUTPUT"

      - name: Cache model weights
        # Same cache as tests.yml, keyed identically -- a warm cache here
        # means this leg's full-suite run is also fully offline. GitHub caches
        # are scoped per-repo BY KEY (not per-workflow), so this byte-identical
        # key shares one entry with tests.yml: whichever workflow populates it
        # first, the other restores it. The only duplicated download is the
        # cold-cache case where both workflows run concurrently and race to
        # populate -- one save wins, the other no-ops (`cache already exists`).
        uses: actions/cache@v4
        with:
          path: ${{ env.LODE_HOME }}/models
          key: ${{ steps.model_cache.outputs.key }}

      - name: Run coverage (nox -s coverage)
        # Runs the FULL suite (no -m filter) under pytest-cov, combining
        # coverage across xdist workers automatically, and writes
        # coverage.xml (Cobertura) to the workspace root. No
        # ANTHROPIC_API_KEY is set: the live eval (tests/test_eval_live.py)
        # self-excludes unless LODE_RUN_LIVE_EVAL=1, which only `nox -s eval`
        # sets, so this leg stays offline and keyless by design, same as
        # tests.yml.
        run: nox -s coverage

      - name: Upload coverage to Codecov
        # Report-only: fail_ci_if_error is explicitly false, so neither a
        # Codecov outage nor an upload hiccup turns this workflow red --
        # coverage is reporting here, not a merge gate (lode-qxdn.3). The
        # repo-scoped CODECOV_TOKEN secret was created by the repo owner
        # (lode-otsh) and can do nothing but accept coverage uploads for
        # this repository.
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
