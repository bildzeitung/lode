name: release

# Tag-triggered clean-room build + GitHub release (docs/release.md). The pushed
# `vX.Y.Z` tag is the version — setuptools-scm resolves it straight from
# `git describe`, so the build here (not a developer's laptop) is what
# produces the artifact that gets published.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # gh release create needs to publish a release + upload assets

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags — setuptools-scm needs git describe to resolve the version

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install build tooling
        # `build` is NOT redundant alongside nox: noxfile.py sets
        # default_venv_backend = "none", so the session shells out to
        # `python -m build` in this ambient interpreter and never installs it.
        run: pip install build nox

      # Step name mentions the assertion on purpose: it runs inside the same
      # session, so a red run here is just as likely to be missing
      # package-data as a failed build. `-- dist` keeps the artifacts on
      # disk for the release step below — the default (no posarg) discards
      # them into a scratch dir. Calls noxfile.py's `build` session rather
      # than re-copying its assertion here (lode-zuqp) — this is the same
      # published wheel a user installs, so it gets the same check
      # build.yml's push/PR runs already had.
      - name: Build wheel + sdist, assert package-data
        run: nox -s build -- dist

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Release notes = the annotated tag's body, composed at kickoff from the
        # resolved bd tickets/epics in the release window (docs/release.md). Not
        # --generate-notes: that is PR-based and empty in this no-PR workflow.
        # actions/checkout leaves the tag as a lightweight ref to the commit
        # (actions/checkout#290), so re-fetch the real annotated tag object first.
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents:body)' "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/notes.md"
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "lode ${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/notes.md"
