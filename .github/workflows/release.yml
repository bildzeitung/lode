name: release

# Tag-triggered clean-room build + GitHub release (docs/release.md). The pushed
# `vX.Y.Z` tag is the version — setuptools-scm resolves it straight from
# `git describe`, so the build here (not a developer's laptop) is what
# produces the artifact that gets published.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # gh release create needs to publish a release + upload assets

# Deliberately carries no `concurrency:` block, unlike its push-triggered
# siblings -- a tag is pushed once, so there is no superseded run to cancel.
# Why, and why cancelling here would be actively wrong:
# docs/release.md#ci-workflow-trigger-scope-push-and-pull_request.

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    # Caps a hung step (a stalled PyPI fetch, or this job's own `gh release
    # create`). Every release run to date finished in 14-30s of job time, so
    # 20 is ~40x the worst observed. Ladder + rationale:
    # docs/release.md#ci-workflow-trigger-scope-push-and-pull_request (lode-w35h).
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags — setuptools-scm needs git describe to resolve the version

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install build tooling
        # `build` is NOT redundant alongside nox: noxfile.py sets
        # default_venv_backend = "none", so the session shells out to
        # `python -m build` in this ambient interpreter and never installs it.
        run: pip install build nox

      # Same session build.yml runs on push/PR, so the PUBLISHED wheel gets the
      # identical package-data assertion (lode-zuqp). The `-- dist` posarg is
      # the release-only part: it keeps the artifacts on disk for the upload
      # step below, where build.yml discards them. See noxfile.py's `build`
      # session for what is asserted and why.
      - name: Build wheel + sdist, assert package-data
        run: nox -s build -- dist

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Release notes = the annotated tag's body, composed at kickoff from the
        # resolved bd tickets/epics in the release window (docs/release.md). Not
        # --generate-notes: that is PR-based and empty in this no-PR workflow.
        # actions/checkout leaves the tag as a lightweight ref to the commit
        # (actions/checkout#290), so re-fetch the real annotated tag object first.
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents:body)' "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/notes.md"
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "lode ${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/notes.md"
