# MkDocs-Material config for the lode docs site (lode-fhql.8/.9/.10).
#
# docs_dir points at the STAGED output of scripts/build_docs_site.py, not at
# docs/ directly -- docs/ contains maintainer-only pages (decisions.md,
# agents-workflow.md, ...) that must never ship on the public site
# (docs/stack.md's "Published / excluded page sets"). Building from a curated
# staging copy makes that total by construction: nothing under docs_dir here
# exists unless build_docs_site.py put it there. This SUPERSEDES the
# `exclude_docs`-allowlist mechanism `lode-fhql.10` originally scaffolded
# (docs_dir: docs + exclude_docs) -- staging is a single, structural
# guarantee rather than two separately-maintained mechanisms; a maintainer
# doc that build_docs_site.py never stages simply cannot ship, `nav` or no
# `nav` (decided 2026-08-14, resolving the lode-fhql.9/.10 mkdocs.yml
# conflict; see lode-fhql.9's notes).
#
# `mkdocs-material` is declared in pyproject.toml's `dev` extra (lode-fhql.20
# -- reversed from an earlier CI-only `docs` extra, per docs/stack.md):
# mkdocs is also a validator (`nox -s docs`), so it's on every dev's PATH via
# ./scripts/python-init.sh.
#
# `nav` below still curates order and labels for the same PUBLISHED set
# build_docs_site.py stages -- see docs/stack.md ("Published / excluded page
# sets") for the authoritative enumeration.
site_name: lode
site_description: >-
  An AI-first, TUI-first personal knowledge base for the things you learn
  during your day at work.
site_url: https://bildzeitung.github.io/lode/
repo_url: https://github.com/bildzeitung/lode
repo_name: bildzeitung/lode
edit_uri: edit/trunk/docs/

docs_dir: .docs-site-src
site_dir: site

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/mark.svg
  # assets/favicon-16.png (lode-fhql.22), not mark-16.png: the tab icon is a
  # theme-neutral, fixed-tile favicon variant -- see docs/assets/favicon-mark.svg's
  # header for why the two diverge (a raster favicon has no theme-conditional
  # mechanism the way the header logo above, an inline currentColor SVG, does).
  favicon: assets/favicon-16.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.top
    - search.suggest
    - content.action.edit

nav:
  - Home: index.md
  - Design: design.md
  - Storage: storage.md
  - Retrieval: retrieval.md
  - Externals: externals.md
  - Brand: brand.md
  - How-to:
      - Overview: how-to/README.md
      - Change a config setting: how-to/config-change.md
      - JIRA setup: how-to/jira-setup.md
      - Maintenance commands: how-to/maintenance-commands.md

plugins:
  - search

markdown_extensions:
  - toc:
      permalink: true
      # Match GitHub's own heading-anchor algorithm (lode-fhql.21) -- the
      # `toc` extension's built-in slugify collapses an em-dash-between-spaces
      # run to a SINGLE hyphen, but GitHub's produces a DOUBLE hyphen (the
      # dash itself is stripped as invalid, leaving two adjacent spaces that
      # each become their own hyphen). Every intra-doc anchor in docs/ is
      # written against GitHub's algorithm (docs render there, not just
      # through this site), and scripts/check_links.py's `github_slug` gate
      # (tests/test_check_links.py) already enforces it repo-wide -- so
      # mkdocs' own build must slug headings the same way, not diverge from
      # the anchors the docs use. src/lode/docs_slug.py holds this side's
      # implementation -- a deliberate copy of the gate's algorithm, not a
      # shared import; that module's docstring owns the why, and
      # tests/test_check_links.py keeps the two copies from drifting.
      slugify: !!python/name:lode.docs_slug.github_slugify

# What `nox -s docs` gates on (lode-fhql.20). mkdocs' own link validator is the
# only thing that knows how mkdocs-material slugs a heading -- scripts/check_links.py
# (`nox -s linkcheck`) resolves the same `#fragment` with GitHub's algorithm, so a
# link can pass there and 404 on the built site. `anchors: warn` promotes that
# check from its INFO default to a warning, which `mkdocs build --strict` then
# turns into a nonzero exit.
#
# Everything else is `ignore` ON PURPOSE, so --strict fails on anchors and nothing
# else: the published set links out of `docs/` in four places (brand.md ->
# ../README.md, how-to/*.md -> ../../src/lode/*.py) that only lode-fhql.9's
# link-rewrite rule can fix, and `exclude_docs` above deliberately drops ~46
# maintainer citations into unpublished pages (docs/stack.md). Flipping any of
# these back to `warn` once lode-fhql.9 lands is a one-word edit here.
validation:
  links:
    anchors: warn
    not_found: ignore
    unrecognized_links: ignore
    absolute_links: ignore
  nav:
    omitted_files: ignore
    not_found: ignore
    absolute_links: ignore
