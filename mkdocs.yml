# lode docs site -- generator chosen and decided in docs/stack.md (lode-fhql.8).
#
# This file is the minimal scaffold the landing page (lode-fhql.10) needs to
# render as the site's index with correct nav and OG/social metadata. Wiring
# this into GitHub Actions/Pages -- including the Mermaid build-time
# pre-render step mandated in docs/stack.md -- is lode-fhql.9's scope, not
# this file's. `mkdocs-material` is declared in pyproject.toml's `dev` extra
# (lode-fhql.20 -- reversed from an earlier CI-only `docs` extra, per
# docs/stack.md): mkdocs is also a validator (`nox -s docs`), so it's on
# every dev's PATH via ./scripts/python-init.sh.
#
# Two SEPARATE mechanisms keep the site to the PUBLISHED set -- `exclude_docs`
# decides what is BUILT, `nav` decides what is LISTED. An explicit `nav` alone
# is NOT enough. Why, and why exclude_docs is written as an allowlist, is
# stated once in docs/stack.md ("mkdocs.yml scaffold and the landing page").

site_name: lode
site_description: >-
  An AI-first, TUI-first personal knowledge base for the things you learn
  during your day at work.
site_url: https://bildzeitung.github.io/lode/
repo_url: https://github.com/bildzeitung/lode
repo_name: bildzeitung/lode
edit_uri: edit/trunk/docs/

docs_dir: docs

# `how-to/` is re-included as a DIRECTORY, not a frozen file list: a guide
# added there later is published by default.
exclude_docs: |
  *
  !index.md
  !design.md
  !storage.md
  !retrieval.md
  !externals.md
  !brand.md
  !how-to/*.md
  !assets/*

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/mark.svg
  favicon: assets/mark-16.png
  palette:
    scheme: default
  features:
    - navigation.instant
    - navigation.top
    - search.suggest
    - content.action.edit

nav:
  - Home: index.md
  - Design: design.md
  - Storage: storage.md
  - Retrieval: retrieval.md
  - Externals: externals.md
  - Brand: brand.md
  - How-to:
      - Overview: how-to/README.md
      - Change a config setting: how-to/config-change.md
      - JIRA setup: how-to/jira-setup.md
      - Maintenance commands: how-to/maintenance-commands.md

plugins:
  - search

markdown_extensions:
  - toc:
      permalink: true

# What `nox -s docs` gates on (lode-fhql.20). mkdocs' own link validator is the
# only thing that knows how mkdocs-material slugs a heading -- scripts/check_links.py
# (`nox -s linkcheck`) resolves the same `#fragment` with GitHub's algorithm, so a
# link can pass there and 404 on the built site. `anchors: warn` promotes that
# check from its INFO default to a warning, which `mkdocs build --strict` then
# turns into a nonzero exit.
#
# Everything else is `ignore` ON PURPOSE, so --strict fails on anchors and nothing
# else: the published set links out of `docs/` in four places (brand.md ->
# ../README.md, how-to/*.md -> ../../src/lode/*.py) that only lode-fhql.9's
# link-rewrite rule can fix, and `exclude_docs` above deliberately drops ~46
# maintainer citations into unpublished pages (docs/stack.md). Flipping any of
# these back to `warn` once lode-fhql.9 lands is a one-word edit here.
validation:
  links:
    anchors: warn
    not_found: ignore
    unrecognized_links: ignore
    absolute_links: ignore
  nav:
    omitted_files: ignore
    not_found: ignore
    absolute_links: ignore
